<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Player Controls</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Media Player</h1>
    </header>
    
    <main>
        <section class="player-controls">
            <h2>Now Playing</h2>
            <p id="status-text">Ready to play</p>
            <div class="controls">
                <button id="play-btn">▶ Play</button>
                <button id="stop-btn">⏹ Stop</button>
                <button id="style-btn">Toggle Theme</button>
                <button id="element-btn">Toggle Playlist</button>
            </div>
        </section>
        
        <div id="playlist-container"></div>
    </main>
    
    <footer>
        <p>Media Player App © 2023</p>
    </footer>

    <script src="script.js"></script>
